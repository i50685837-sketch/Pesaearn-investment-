<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pesaearn Profile</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">


<style>

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#08111f,#1e1136);
color:white;
}

.card{
background:rgba(15,23,42,.85);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.1);
}

</style>

</head>


<body class="min-h-screen p-5">


<div class="flex justify-between items-center mb-8">


<a href="dashboard.html"
class="text-green-400 font-bold">

← Dashboard

</a>


<h1 class="text-2xl font-black">

Profile 👤

</h1>


</div>





<div class="card max-w-xl mx-auto rounded-3xl p-8 text-center">





<!-- Profile Image -->

<img id="profilePic"

src="https://via.placeholder.com/120"

class="w-28 h-28 rounded-full mx-auto object-cover border-4 border-green-400">






<input 

type="file"

id="imageUpload"

accept="image/*"

class="mt-5 w-full text-sm">





<h2 id="name"

class="text-2xl font-bold mt-5">

User

</h2>


<p id="email"

class="text-slate-400">

Email

</p>







<div class="mt-8 space-y-4">





<div class="bg-slate-800 p-4 rounded-xl flex justify-between">

<span>
💰 Investment
</span>

<span id="investment"
class="text-green-400 font-bold">

KSh 0

</span>

</div>





<div class="bg-slate-800 p-4 rounded-xl flex justify-between">

<span>
⭐ Points
</span>

<span id="points"
class="text-green-400 font-bold">

0

</span>

</div>





<div class="bg-slate-800 p-4 rounded-xl flex justify-between">

<span>
✅ Status
</span>

<span class="text-green-400 font-bold">

Active

</span>

</div>




</div>








<button onclick="logout()"

class="mt-8 w-full bg-red-500 py-4 rounded-xl font-bold">

Logout 🚪

</button>




</div>








<script>


// Load user details

document.getElementById("name").innerHTML =
localStorage.getItem("fullname") || "User";



document.getElementById("email").innerHTML =
localStorage.getItem("email") || "No email";



document.getElementById("investment").innerHTML =
"KSh " + (localStorage.getItem("investmentAmount") || 0);



document.getElementById("points").innerHTML =
localStorage.getItem("points") || 0;






// Load saved picture

let savedImage =
localStorage.getItem("profilePic");


if(savedImage){

document.getElementById("profilePic").src =
savedImage;

}






// Upload picture

document
.getElementById("imageUpload")
.addEventListener("change",function(){


let file=this.files[0];


if(file){


let reader=new FileReader();



reader.onload=function(e){


localStorage.setItem(
"profilePic",
e.target.result
);



document.getElementById("profilePic").src =
e.target.result;


};



reader.readAsDataURL(file);


}



});







function logout(){


localStorage.removeItem("loggedIn");


alert("Logout successful ✅");


window.location.href="login.html";


}



</script>



</body>

  </html>
