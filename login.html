<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pesaearn | Login</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:
linear-gradient(rgba(8,15,35,.88),rgba(8,15,35,.92)),
url("https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=1600&q=80");
background-size:cover;
background-position:center;
background-attachment:fixed;
}
</style>

</head>

<body class="min-h-screen flex items-center justify-center px-4">

<div class="bg-slate-900/80 backdrop-blur-xl border border-purple-500/30 rounded-3xl shadow-2xl p-8 w-full max-w-md">

<div class="text-center">

<div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-r from-emerald-500 to-purple-600 flex items-center justify-center text-3xl font-black text-white">

P

</div>

<h1 class="text-4xl font-black text-white mt-5">

Welcome Back

</h1>

<p class="text-slate-300 mt-2">

Login to your Pesaearn account.

</p>

</div>

<button class="w-full mt-8 py-4 rounded-xl bg-white text-black font-semibold hover:bg-gray-200 transition">

<i class="fa-brands fa-google text-red-500 mr-2"></i>

Continue with Google

</button>

<div class="flex items-center my-8">

<hr class="flex-1 border-slate-700">

<span class="px-4 text-slate-400">OR</span>

<hr class="flex-1 border-slate-700">

</div>

<form action="/api/login" method="POST">

<div class="mb-5">

<label class="block text-slate-300 mb-2">
Email Address
</label>

<input
type="email"
name="email"
required
placeholder="Enter your email"
class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 text-white focus:border-emerald-500 outline-none">

</div>

<div class="mb-4">

<label class="block text-slate-300 mb-2">
Password
</label>

<input
type="password"
name="password"
required
placeholder="Enter your password"
class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 text-white focus:border-purple-500 outline-none">

</div>

<div class="flex justify-between items-center mb-6">

<label class="flex items-center gap-2 text-slate-300 text-sm">

<input type="checkbox">

Remember me

</label>

<a href="#" class="text-emerald-400 text-sm hover:underline">

Forgot Password?

</a>

</div>

<button
type="submit"
class="w-full py-4 rounded-xl bg-gradient-to-r from-emerald-500 via-green-500 to-purple-600 text-white font-bold hover:scale-105 transition">

Login

</button>

</form>

<p class="text-center text-slate-400 mt-8">

Don't have an account?

<a href="register.html" class="text-emerald-400 font-semibold hover:underline">

Register

</a>

</p>

</div>

</body>
</html>
