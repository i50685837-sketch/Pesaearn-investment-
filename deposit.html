<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pesaearn Deposit</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#08111f,#1e1136);
color:white;
}

.card{
background:rgba(15,23,42,.9);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.1);
}

input{
background:#0f172a;
border:1px solid #22c55e;
color:white;
}

input:focus{
outline:none;
border-color:#4ade80;
box-shadow:0 0 10px #22c55e;
}

</style>

</head>

<body class="min-h-screen flex items-center justify-center p-5">

<div class="card max-w-md w-full rounded-3xl p-8">

<div class="text-center">

<h1 class="text-3xl font-black text-green-400">
💰 Deposit Funds
</h1>

<p class="text-slate-400 mt-2">
Fund your investment wallet securely with M-Pesa.
</p>

</div>

<form id="depositForm" class="mt-8 space-y-5">

<div>

<label class="font-semibold">
Deposit Amount (KSh)
</label>

<input
id="amount"
type="number"
min="650"
placeholder="Minimum KSh 650"
required
class="w-full mt-2 p-4 rounded-xl">

</div>

<div>

<label class="font-semibold">
M-Pesa Phone Number
</label>

<input
id="phone"
type="tel"
placeholder="2547XXXXXXXX"
required
class="w-full mt-2 p-4 rounded-xl">

</div>

<button
type="submit"
class="w-full py-4 rounded-xl font-bold text-white
bg-gradient-to-r from-green-500 via-emerald-500 to-green-600
hover:from-green-600 hover:to-emerald-700
transition duration-300 shadow-lg shadow-green-500/40">

💳 Deposit with M-Pesa

</button>

</form>

<p id="message" class="text-center mt-5 font-bold"></p>

<div class="mt-8 bg-slate-800 rounded-2xl p-4">

<h3 class="font-bold text-green-400 mb-2">
Deposit Rules
</h3>

<ul class="text-sm text-slate-300 space-y-2">
<li>✅ Minimum Deposit: KSh 650</li>
<li>✅ Maximum Deposit: KSh 100,000</li>
<li>✅ Payments are made via M-Pesa STK Push.</li>
<li>✅ Your wallet will be credited after successful payment confirmation.</li>
</ul>

</div>

</div>

<script>

document.getElementById("depositForm").addEventListener("submit", function(e){

e.preventDefault();

let amount = Number(document.getElementById("amount").value);
let phone = document.getElementById("phone").value.trim();

if(amount < 650){

document.getElementById("message").innerHTML =
"❌ Minimum deposit is KSh 650.";

document.getElementById("message").className =
"text-red-400 text-center mt-5 font-bold";

return;

}

document.getElementById("message").innerHTML =
"⏳ Preparing your M-Pesa payment request...";

document.getElementById("message").className =
"text-green-400 text-center mt-5 font-bold";

/*
Later, connect this form to your Node.js backend, for example:

fetch("http://localhost:5000/api/payments/stk-push", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    amount: amount,
    phone: phone
  })
});
*/

});

</script>

</body>
</html>
