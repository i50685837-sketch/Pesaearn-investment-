<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pesaearn Settings</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">


<style>

body{
font-family:'Poppins',sans-serif;
background:#08111f;
color:white;
transition:.3s;
}

.card{
background:rgba(15,23,42,.85);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.1);
}


input,select{
background:#020617;
border:1px solid #334155;
color:white;
}

.light{
background:#f1f5f9;
color:#020617;
}


</style>

</head>


<body class="min-h-screen p-5">



<div class="flex justify-between items-center mb-8">


<a href="dashboard.html"
class="text-green-400 font-bold">

← Dashboard

</a>


<h1 class="text-2xl font-bold">

Settings ⚙️

</h1>


</div>






<div class="card max-w-xl mx-auto rounded-3xl p-8">





<h2 class="text-2xl font-bold mb-6">

Account Settings

</h2>





<!-- Profile Name -->


<label>
Profile Name
</label>

<input
id="name"
class="w-full p-4 rounded-xl mt-2 mb-5"
placeholder="Enter name">







<!-- Email -->


<label>
Email Address
</label>

<input

id="email"

type="email"

class="w-full p-4 rounded-xl mt-2 mb-5"

placeholder="Enter email">







<!-- Password -->


<label>
New Password
</label>

<input

id="password"

type="password"

class="w-full p-4 rounded-xl mt-2 mb-5"

placeholder="Change password">







<!-- Theme -->


<label>
Theme Settings 🎨
</label>


<select id="theme"

class="w-full p-4 rounded-xl mt-2 mb-6">


<option value="dark">
Dark Mode 🌙
</option>


<option value="light">
Light Mode ☀️
</option>


<option value="system">
System Default 📱
</option>


</select>







<button onclick="saveSettings()"

class="w-full bg-green-500 text-black p-4 rounded-xl font-bold">

Save Changes ✅

</button>





<p id="message"
class="text-center mt-5 text-green-400 font-bold">

</p>



</div>









<script>


// Load user data

document.getElementById("name").value =
localStorage.getItem("fullname") || "";


document.getElementById("email").value =
localStorage.getItem("email") || "";


document.getElementById("theme").value =
localStorage.getItem("theme") || "dark";







function saveSettings(){



let name =
document.getElementById("name").value;


let email =
document.getElementById("email").value;


let password =
document.getElementById("password").value;


let theme =
document.getElementById("theme").value;





localStorage.setItem(
"fullname",
name
);



localStorage.setItem(
"email",
email
);





if(password){

localStorage.setItem(
"password",
password
);

}





localStorage.setItem(
"theme",
theme
);



applyTheme();



document.getElementById("message").innerHTML =
"Settings saved successfully ✅";



}







function applyTheme(){


let theme =
localStorage.getItem("theme");



if(theme==="light"){


document.body.classList.add("light");


}



else{


document.body.classList.remove("light");


}


}




applyTheme();



</script>



</body>

  </html>
