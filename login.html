<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pesaearn - Login</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(135deg,#08111f,#1e1136);

min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:white;

}


.card{

background:rgba(15,23,42,.85);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.1);

}


input{

background:#020617;
border:1px solid #334155;
color:white;

}


input:focus{

outline:none;
border-color:#22c55e;

}

</style>

</head>


<body>


<div class="card w-full max-w-md rounded-3xl p-8 shadow-2xl">



<div class="text-center mb-8">


<div class="w-20 h-20 mx-auto rounded-full
bg-gradient-to-r from-green-500 to-purple-600
flex items-center justify-center text-4xl font-black">

P

</div>


<h1 class="text-3xl font-black mt-4">

Pesa<span class="text-green-400">earn</span>

</h1>


<p class="text-slate-400 mt-2">

Login to access your dashboard

</p>


</div>





<form id="loginForm" class="space-y-5">



<div>

<label class="text-sm text-slate-400">

Email Address

</label>


<input
id="loginEmail"
type="email"
placeholder="Enter your email"
required
class="w-full mt-2 p-4 rounded-xl">

</div>





<div>

<label class="text-sm text-slate-400">

Password

</label>


<input
id="loginPassword"
type="password"
placeholder="Enter your password"
required
class="w-full mt-2 p-4 rounded-xl">

</div>





<div class="flex justify-between text-sm">


<label class="flex gap-2 items-center">

<input type="checkbox">

Remember me

</label>


<a href="forgot-password.html"
class="text-green-400">

Forgot password?

</a>


</div>





<button
type="submit"
class="w-full py-4 rounded-xl
bg-gradient-to-r from-green-500 to-purple-600
font-bold text-black hover:scale-105 transition">

Login ✅

</button>



</form>






<p class="text-center text-slate-400 mt-6">

Don't have an account?

<a href="register.html"
class="text-green-400 font-bold">

Register

</a>

</p>



</div>






<script>


document
.getElementById("loginForm")
.addEventListener("submit",function(e){


e.preventDefault();



let savedEmail =
localStorage.getItem("email");


let savedPassword =
localStorage.getItem("password");



let email =
document.getElementById("loginEmail").value;


let password =
document.getElementById("loginPassword").value;





if(email === savedEmail && password === savedPassword){


alert("Login successful ✅");


window.location.href="dashboard.html";


}

else{


alert("Invalid email or password ❌");


}



});



</script>



</body>

</html>
