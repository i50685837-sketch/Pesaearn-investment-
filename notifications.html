<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pesaearn Notifications</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">


<style>

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#08111f,#1e1136);
color:white;
}

.card{
background:rgba(15,23,42,.85);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.1);
}

</style>

</head>


<body class="min-h-screen p-5">



<div class="flex justify-between items-center mb-8">


<a href="dashboard.html"
class="text-green-400 font-bold">

← Dashboard

</a>


<h1 class="text-2xl font-black">

Notifications 🔔

</h1>


</div>







<div class="card rounded-3xl p-6">



<h2 class="text-xl font-bold mb-5">

Recent Notifications

</h2>





<div id="notifications"
class="space-y-4">





<div class="bg-slate-800 p-4 rounded-xl">

🎉 Welcome to Pesaearn

<p class="text-slate-400 text-sm">

Your account was created successfully.

</p>

</div>







<div class="bg-slate-800 p-4 rounded-xl">

📋 Survey Reward

<p class="text-slate-400 text-sm">

Complete surveys and earn reward points.

</p>

</div>








<div class="bg-slate-800 p-4 rounded-xl">

📈 Investment Update

<p class="text-slate-400 text-sm">

Your investment details have been updated.

</p>

</div>








<div class="bg-slate-800 p-4 rounded-xl">

👛 Wallet Activity

<p class="text-slate-400 text-sm">

Check your latest wallet transactions.

</p>

</div>





</div>







<button onclick="markRead()"

class="mt-6 w-full bg-green-500 text-black py-4 rounded-xl font-bold">

Mark All As Read ✅

</button>




<p id="message"
class="text-center mt-4 text-green-400 font-bold">

</p>



</div>









<script>


function markRead(){


document.getElementById("message").innerHTML =
"All notifications marked as read ✅";



localStorage.setItem(
"notificationsRead",
"true"
);



}





</script>



</body>

</html>
