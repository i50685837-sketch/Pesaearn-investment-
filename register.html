<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pesaearn - Register</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(135deg,#08111f,#1e1136);

min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:white;

}


.card{

background:rgba(15,23,42,.85);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.1);

}


input{

background:#020617;
border:1px solid #334155;
color:white;

}


input:focus{

outline:none;
border-color:#22c55e;

}

</style>

</head>


<body>


<div class="card w-full max-w-md rounded-3xl p-8 shadow-2xl">


<div class="text-center mb-8">


<div class="w-20 h-20 mx-auto rounded-full 
bg-gradient-to-r from-green-500 to-purple-600
flex items-center justify-center text-4xl font-black">

P

</div>


<h1 class="text-3xl font-black mt-4">

Pesa<span class="text-green-400">earn</span>

</h1>


<p class="text-slate-400 mt-2">

Create your account and start earning

</p>


</div>




<form id="registerForm" class="space-y-5">



<div>

<label class="text-sm text-slate-400">
Full Name
</label>

<input
id="fullname"
type="text"
placeholder="Enter your full name"
required
class="w-full mt-2 p-4 rounded-xl">

</div>





<div>

<label class="text-sm text-slate-400">
Email Address
</label>

<input
id="email"
type="email"
placeholder="Enter your email address"
required
class="w-full mt-2 p-4 rounded-xl">

</div>





<div>

<label class="text-sm text-slate-400">
Password
</label>

<input
id="password"
type="password"
placeholder="Create a password"
required
class="w-full mt-2 p-4 rounded-xl">

</div>





<div class="flex gap-3 items-center">

<input
id="policy"
type="checkbox"
required
class="w-5 h-5">


<label class="text-sm text-slate-400">

I accept the Terms & Privacy Policy

</label>


</div>





<button
type="submit"
class="w-full py-4 rounded-xl 
bg-gradient-to-r from-green-500 to-purple-600
font-bold text-black hover:scale-105 transition">

Create Account ✅

</button>



</form>





<p class="text-center text-slate-400 mt-6">

Already have an account?

<a href="login.html"
class="text-green-400 font-bold">

Login

</a>

</p>



</div>





<script>


document
.getElementById("registerForm")
.addEventListener("submit",function(e){


e.preventDefault();



let fullname =
document.getElementById("fullname").value;


let email =
document.getElementById("email").value;


let password =
document.getElementById("password").value;



localStorage.setItem("fullname",fullname);

localStorage.setItem("email",email);

localStorage.setItem("password",password);



alert("Account successfully created ✅");


window.location.href="dashboard.html";


});



</script>


</body>

  </html>
