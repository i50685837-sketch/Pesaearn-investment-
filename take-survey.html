<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Complete Survey - Pesaearn</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-slate-950 text-white min-h-screen p-5">


<div class="max-w-xl mx-auto bg-slate-900 rounded-3xl p-8">


<h1 class="text-3xl font-bold">
Complete Survey 📋
</h1>


<p class="text-slate-400 mt-3">
Answer all 10 questions to receive your reward.
</p>




<form id="surveyForm" class="space-y-6 mt-8">



<div>
<label>1. How often do you use the internet?</label>

<select required class="w-full mt-2 p-3 text-black rounded-xl">
<option>Daily</option>
<option>Weekly</option>
<option>Rarely</option>
</select>
</div>





<div>
<label>2. Which device do you use most?</label>

<select required class="w-full mt-2 p-3 text-black rounded-xl">
<option>Smartphone</option>
<option>Computer</option>
<option>Tablet</option>
</select>
</div>





<div>
<label>3. What type of apps do you use most?</label>

<select required class="w-full mt-2 p-3 text-black rounded-xl">
<option>Social Media</option>
<option>Finance</option>
<option>Entertainment</option>
<option>Education</option>
</select>
</div>





<div>
<label>4. Do you shop online?</label>

<select required class="w-full mt-2 p-3 text-black rounded-xl">
<option>Yes</option>
<option>No</option>
</select>
</div>





<div>
<label>5. Have you used digital payments?</label>

<select required class="w-full mt-2 p-3 text-black rounded-xl">
<option>Yes</option>
<option>No</option>
</select>
</div>





<div>
<label>6. How do you learn new skills?</label>

<select required class="w-full mt-2 p-3 text-black rounded-xl">
<option>Online courses</option>
<option>School</option>
<option>Friends</option>
</select>
</div>





<div>
<label>7. Do you follow technology news?</label>

<select required class="w-full mt-2 p-3 text-black rounded-xl">
<option>Often</option>
<option>Sometimes</option>
<option>Never</option>
</select>
</div>





<div>
<label>8. How many hours do you spend online daily?</label>

<select required class="w-full mt-2 p-3 text-black rounded-xl">
<option>1-3 Hours</option>
<option>4-6 Hours</option>
<option>7+ Hours</option>
</select>
</div>





<div>
<label>9. Would you recommend digital services to others?</label>

<select required class="w-full mt-2 p-3 text-black rounded-xl">
<option>Yes</option>
<option>No</option>
</select>
</div>





<div>
<label>10. Any feedback about online services?</label>

<textarea required
class="w-full mt-2 p-3 text-black rounded-xl"
placeholder="Write your opinion"></textarea>

</div>





<button type="submit"

class="w-full bg-green-500 text-black p-4 rounded-xl font-bold">

Finish Survey ✅

</button>



</form>


</div>







<script>


let params =
new URLSearchParams(window.location.search);


let reward =
Number(params.get("reward")) || 50;




document
.getElementById("surveyForm")
.addEventListener("submit",function(e){


e.preventDefault();



let points =
Number(localStorage.getItem("points") || 0);



let investment =
Number(localStorage.getItem("investmentAmount") || 0);





points += reward;

investment += reward;



localStorage.setItem("points",points);

localStorage.setItem("investmentAmount",investment);



alert(
"Survey completed ✅ +" + reward + " Points"
);



window.location.href="dashboard.html";



});



</script>


</body>

</html>
