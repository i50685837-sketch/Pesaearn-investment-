<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pesaearn Deposit</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">


<style>

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#08111f,#1e1136);
color:white;
}


.card{
background:rgba(15,23,42,.85);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.1);
}


input{
background:#020617;
border:1px solid #334155;
color:white;
}

</style>

</head>


<body class="min-h-screen p-5">


<!-- Header -->

<div class="flex justify-between items-center mb-8">


<a href="wallet.html"
class="text-green-400 font-bold">

← Wallet

</a>


<h1 class="text-2xl font-black">

Deposit 💳

</h1>


</div>





<!-- Deposit Card -->


<div class="card max-w-xl mx-auto rounded-3xl p-8">


<h2 class="text-2xl font-bold">

Add Money

</h2>


<p class="text-slate-400 mt-2">

Enter the amount you want to deposit.

</p>





<form id="depositForm"
class="mt-6 space-y-5">



<div>

<label class="text-sm text-slate-400">

Amount (KSh)

</label>


<input
id="depositAmount"
type="number"
min="650"
placeholder="Minimum KSh 650"
required
class="w-full mt-2 p-4 rounded-xl">


</div>





<div>

<label class="text-sm text-slate-400">

Payment Method

</label>


<select
id="method"
class="w-full mt-2 p-4 rounded-xl text-black">


<option>MPESA</option>

<option>Bank Transfer</option>

<option>Card</option>


</select>


</div>





<button
type="submit"
class="w-full py-4 rounded-xl
bg-gradient-to-r from-green-500 to-purple-600
font-bold text-black">

Confirm Deposit ✅

</button>



</form>





<p id="message"
class="text-center mt-5 font-bold">

</p>


</div>







<script>


document
.getElementById("depositForm")
.addEventListener("submit",function(e){


e.preventDefault();



let amount =
Number(document.getElementById("depositAmount").value);



let message =
document.getElementById("message");



if(amount < 650){


message.innerHTML =
"Minimum deposit is KSh 650 ❌";


message.className="text-red-400";


return;


}




localStorage.setItem("balance",amount);



message.innerHTML =
"Deposit request successful ✅";


message.className="text-green-400";



setTimeout(()=>{


window.location.href="wallet.html";


},1500);



});



</script>



</body>

</html>
