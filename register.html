<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pesaearn | Register</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:
linear-gradient(rgba(10,15,35,.88),rgba(10,15,35,.92)),
url("https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=1600&q=80");
background-size:cover;
background-position:center;
background-attachment:fixed;
}

.card{
backdrop-filter:blur(20px);
}

</style>

</head>

<body class="min-h-screen flex items-center justify-center px-4">

<div class="card bg-slate-900/80 border border-emerald-500/30 rounded-3xl shadow-2xl p-8 w-full max-w-md">

<div class="text-center">

<div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-r from-emerald-500 to-purple-600 flex items-center justify-center text-white text-3xl font-black">

P

</div>

<h1 class="text-4xl font-black text-white mt-5">

Create Account

</h1>

<p class="text-slate-300 mt-2">

Join Pesaearn today.

</p>

</div>

<button class="w-full mt-8 py-4 rounded-xl bg-white text-black font-semibold hover:bg-gray-200 transition">

<i class="fa-brands fa-google text-red-500 mr-2"></i>

Continue with Google

</button>

<div class="flex items-center my-8">

<hr class="flex-1 border-slate-700">

<span class="px-4 text-slate-400">
OR
</span>

<hr class="flex-1 border-slate-700">

</div>

<form action="/api/register" method="POST">

<div class="mb-4">

<label class="text-slate-300 block mb-2">
Full Name
</label>

<input
type="text"
name="fullname"
required
placeholder="Your full name"
class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 text-white focus:border-emerald-500 outline-none">

</div>

<div class="mb-4">

<label class="text-slate-300 block mb-2">
Email Address
</label>

<input
type="email"
name="email"
required
placeholder="name@example.com"
class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 text-white focus:border-purple-500 outline-none">

</div>

<div class="mb-4">

<label class="text-slate-300 block mb-2">
Password
</label>

<input
type="password"
name="password"
required
placeholder="Create password"
class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 text-white focus:border-emerald-500 outline-none">

</div>

<div class="flex items-start gap-3 mb-6">

<input
type="checkbox"
required
class="mt-1">

<label class="text-slate-300 text-sm">

I agree to the

<a href="#" class="text-emerald-400 hover:underline">

Privacy Policy

</a>

and

<a href="#" class="text-purple-400 hover:underline">

Terms & Conditions

</a>

</label>

</div>

<button
type="submit"
class="w-full py-4 rounded-xl bg-gradient-to-r from-emerald-500 via-green-500 to-purple-600 text-white font-bold hover:scale-105 transition">

Create Account

</button>

</form>

<p class="text-center text-slate-400 mt-8">

Already have an account?

<a href="login.html" class="text-emerald-400 font-semibold hover:underline">

Login

</a>

</p>

</div>

</body>
  </html>
