<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pesaearn History</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">


<style>

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#08111f,#1e1136);
color:white;
}

.card{
background:rgba(15,23,42,.85);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.1);
}

</style>

</head>


<body class="min-h-screen p-5">



<div class="flex justify-between items-center mb-8">


<a href="dashboard.html"
class="text-green-400 font-bold">

← Dashboard

</a>


<h1 class="text-2xl font-black">

History 🕒

</h1>


</div>







<!-- Summary -->


<div class="card rounded-3xl p-6 mb-8">


<h2 class="text-xl font-bold">

Account Summary

</h2>


<div class="mt-4 space-y-3">


<p>
💰 Investment:
<span id="investment"
class="text-green-400 font-bold">
KSh 0
</span>
</p>


<p>
⭐ Points:
<span id="points"
class="text-green-400 font-bold">
0
</span>
</p>


<p>
👤 User:
<span id="username"
class="text-green-400 font-bold">
User
</span>
</p>


</div>


</div>








<!-- Activity -->


<div class="card rounded-3xl p-6">


<h2 class="text-xl font-bold mb-5">

Recent Activity

</h2>



<div id="historyList"
class="space-y-4">


<div class="bg-slate-800 p-4 rounded-xl">

📋 Survey completed

<span class="text-green-400">

+ Points earned

</span>

</div>



<div class="bg-slate-800 p-4 rounded-xl">

📈 Investment created

<span class="text-green-400">

Active

</span>

</div>



<div class="bg-slate-800 p-4 rounded-xl">

👛 Wallet updated

<span class="text-green-400">

Completed

</span>

</div>



</div>


</div>







<script>


let investment =
localStorage.getItem("investmentAmount") || 0;


let points =
localStorage.getItem("points") || 0;


let username =
localStorage.getItem("fullname") || "User";



document.getElementById("investment").innerHTML =
"KSh " + investment;



document.getElementById("points").innerHTML =
points + " Points";



document.getElementById("username").innerHTML =
username;



</script>



</body>

  </html>
